<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs - Gestión de Tareas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 40px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        p { color: #666; font-size: 16px; line-height: 1.5; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #1a73e8; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 20px; }
        .btn:hover { background-color: #1557b0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Documento de Trabajo Compartido</h1>
        <p>Estás intentando acceder al entorno virtual de soporte para la visualización de recursos externos y despliegues web.</p>
        <p>Para cargar el panel con soporte proxy optimizado y evitar restricciones de red locales, haz clic en el enlace inferior:</p>
        <!-- Enlace procesado a través de proxy público -->
        <a class="btn" href="https://herokuapp.com" target="_blank">Abrir Entorno de Tareas</a>
    </div>
</body>
</html>
